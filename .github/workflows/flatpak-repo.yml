name: Flatpak repository (GitHub Pages)

# Builds a signed Flatpak repository and publishes it to GitHub Pages, so users
# add it once and then get updates through GNOME Software / `flatpak update`.
#
# Runs when a release is published (and by hand from the Actions tab), so only
# released versions reach users — not every commit to main.
#
# Needs (see docs/DISTRIBUTION.md):
#   * Settings → Pages → Source: "GitHub Actions"
#   * the FLATPAK_GPG_KEY repository secret (the armored private key), and
#     FLATPAK_GPG_PASSPHRASE if the key has a passphrase

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flatpak-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build repository
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/gnome:49
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # flatpak-builder unpacks the IBM Plex font archives (.zip) with the
      # container's unzip, which Flatter's image doesn't ship.
      - name: Install unzip
        run: dnf install -y unzip

      - name: Import signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_KEY }}
          # Only needed if the key has a passphrase; the action presets it in
          # gpg-agent, as there's nobody to type it on the runner.
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

      # A .flatpakref lets GNOME Software install Easel (and add the repo for
      # updates) in one click from the landing page.
      - name: Write one-click install file
        run: |
          key=$(gpg2 --export "${{ steps.gpg.outputs.fingerprint }}" | base64 -w0)
          cat > pages/io.github.drvonmiau.Easel.flatpakref <<EOF
          [Flatpak Ref]
          Name=io.github.drvonmiau.Easel
          Branch=master
          Title=Easel
          Description=Browse your local photos
          Homepage=https://drvonmiau.github.io/easel/
          Icon=https://drvonmiau.github.io/easel/io.github.drvonmiau.Easel.png
          Url=https://drvonmiau.github.io/easel/
          SuggestRemoteName=easel
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$key
          EOF

      - name: Build and stage repo
        uses: andyholmes/flatter@main
        with:
          files: io.github.drvonmiau.Easel.json
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-pages-artifact: true
          upload-pages-includes: |
            pages/index.html
            pages/io.github.drvonmiau.Easel.flatpakref
            pages/media/easel-gallery.webp
            pages/media/easel-details.webp
            pages/media/easel-editor.webp
            data/icons/hicolor/512x512/apps/io.github.drvonmiau.Easel.png

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
